<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SilverMessages</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div id="chat-body" class="no-scrollbar"></div>
    <div id="typing"></div>
    <input id="chat-input" placeholder="Send something....">
</body>
<script>
    const uid = localStorage.getItem('uid');
    if(!uid) {
        window.location = "/register"
    }

    const chatID = localStorage.getItem('chatID');

    let name = "";

    fetch("http://161.97.222.175:17356/get-name", {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            uid: uid
        })
    }).then(response => response.text()).then(data => {name = data});

    var lastChats = [];

    const arraysDoNotMatch = (arr1, arr2) => {
        if (arr1.length !== arr2.length) return true; 
        
        return arr1.some((val, index) => val !== arr2[index]);
    };

    var typers = [];

    async function updateTyping() {
        document.getElementById("typing").innerHTML = "";
        for(const typer of typers) {
            if(typer != uid) {
                const response = await fetch("http://161.97.222.175:17356/get-name", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        uid: typer
                    })
                });

                const responseText = await response.text();

                document.getElementById("typing").innerHTML += responseText + " is typing...<br>";
            }
        }
    }

    async function updateChat() {
        const response = await fetch("http://161.97.222.175:17356/fetch-chat", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                id: chatID,
                uid: uid,
                typing: document.getElementById("chat-input").value != ""
            })
        });
        const responseJSON = await response.json();
        if(arraysDoNotMatch(responseJSON.typing, typers)) {
            typers = responseJSON.typing;
            updateTyping();
        }

        var chats = responseJSON.chats;
        if(arraysDoNotMatch(chats, lastChats)) {
            console.log(chats)
            console.log(lastChats)
            lastChats = [...responseJSON.chats];
            for(let i = 0; i < chats.length; i++) {
                if(chats[i].startsWith(name)) {
                    chats[i] = '<p class="own">' + chats[i].replace(name, "You") + '</p>';
                } else {
                    chats[i] = '<p class="message">' + chats[i] + '</p>';
                }
            }
            document.getElementById("chat-body").innerHTML = chats.join("");
            document.getElementById("chat-body").scrollTop = document.getElementById("chat-body").scrollHeight;
        }
    }

    setInterval(updateChat, 500);

    const inputField = document.getElementById("chat-input");

    inputField.addEventListener("keydown", async function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
	    if(inputField.value == "RESET") {
	        const response = await fetch("http://161.97.222.175:17356/reset", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        chat: chatID
                    })
                });
                inputField.value = "";
                return;
            }
            const response = await fetch("http://161.97.222.175:17356/send", {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    uid: uid,
                    chat: chatID,
                    message: inputField.value
                })
            });
            inputField.value = "";
        }
    });
    const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
    async function init() {
        await sleep(1000);
        document.getElementById("chat-body").scrollTop = document.getElementById("chat-body").scrollHeight;
    }
    init();
</script>
</html>
